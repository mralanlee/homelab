apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-bmy
spec:
  refreshInterval: 23h30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-sdk
  target:
    name: argocd-repo-bmy
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/mralanlee/bmy.git
        username: mralanlee
        password: {{ `{{ .pat }}` | quote }}
  data:
    - secretKey: pat
      remoteRef:
        key: argocd-github-pat/credential
