apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-lace
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-sdk
  target:
    name: argocd-repo-lace
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/mralanlee/lace.git
        username: mralanlee
        password: "{{ .pat }}"
  data:
    - secretKey: pat
      remoteRef:
        key: argocd-github-pat/credential
