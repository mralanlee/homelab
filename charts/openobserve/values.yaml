# Sub-chart: openobserve-standalone (https://charts.openobserve.ai).
openobserve-standalone:
  # Keep resource names short: without this everything is named
  # openobserve-openobserve-standalone-*.
  fullnameOverride: openobserve

  # Local disk mode — no MinIO/S3. The upstream MinIO dependency stays disabled.
  minio:
    enabled: false

  persistence:
    enabled: true
    # truenas-iscsi has allowVolumeExpansion: true — grow in place by bumping size.
    size: 50Gi
    storageClass: truenas-iscsi
    accessModes:
      - ReadWriteOnce

  # Root credentials come from the openobserve-root Secret that ESO pulls from
  # 1Password (templates/admin-credentials.yaml) — no plaintext in git.
  auth:
    ZO_ROOT_USER_EMAIL: ""
    ZO_ROOT_USER_PASSWORD: ""
    existingRootUserSecret:
      name: openobserve-root
      emailKey: ZO_ROOT_USER_EMAIL
      passwordKey: ZO_ROOT_USER_PASSWORD

  config:
    ZO_WEB_URL: https://openobserve.k8s.shimmerlabs.xyz
    # Don't phone home.
    ZO_TELEMETRY: "false"
    # Upstream default is 3650 days, which the 50Gi volume cannot hold.
    # A stream's own retention setting (UI) overrides this.
    ZO_COMPACT_DATA_RETENTION_DAYS: "30"

  # Scrape OpenObserve's own /metrics with kube-prometheus-stack.
  # prometheus-operator CRDs sync at wave -20, well before this app (wave 10).
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

externalSecrets:
  store: onepassword-sdk
  # 1Password item (vault shimmer-labs) holding the root login: fields
  # `username` (an email) and `password`. OpenObserve refuses to start unless
  # the password has lower, upper, digit and a special character.
  rootUserItem: openobserve-root

ingress:
  hostname: openobserve.k8s.shimmerlabs.xyz
  gatewayName: homelab
  gatewayNamespace: gateway
  gatewaySectionName: https
