apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-root
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: 30h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.store }}
  target:
    # Consumed by the subchart via auth.existingRootUserSecret.
    name: openobserve-root
    creationPolicy: Owner
    template:
      data:
        ZO_ROOT_USER_EMAIL: "{{ `{{ .username }}` }}"
        ZO_ROOT_USER_PASSWORD: "{{ `{{ .password }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.rootUserItem }}/username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.rootUserItem }}/password
