apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: openobserve-root-password
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  length: 32
  # OpenObserve refuses to start unless the root password has a lowercase letter,
  # an uppercase letter, a digit and a non-alphanumeric character.
  digits: 4
  symbols: 4
  # URL- and shell-safe, and no ":" so it survives basic auth.
  symbolCharacters: "-_.~"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve-root
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openobserve
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshPolicy: CreatedOnce
  target:
    # Consumed by the subchart via auth.existingRootUserSecret.
    name: openobserve-root
    creationPolicy: Owner
    template:
      data:
        ZO_ROOT_USER_EMAIL: {{ .Values.rootUser.email | quote }}
        ZO_ROOT_USER_PASSWORD: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          apiVersion: generators.external-secrets.io/v1alpha1
          name: openobserve-root-password
