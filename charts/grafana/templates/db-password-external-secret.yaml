apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-auth
  namespace: grafana
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-db-auth
    creationPolicy: Owner
    template:
      data:
        username: grafana
        password: "{{ `{{ .password }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          apiVersion: generators.external-secrets.io/v1alpha1
          name: grafana-db-password
