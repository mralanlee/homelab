---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jellyfin.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.ingress.gatewayName | default "homelab" }}
      namespace: {{ .Values.ingress.gatewayNamespace | default "gateway" }}
      sectionName: {{ .Values.ingress.gatewaySectionName | default "https" }}
  hostnames:
    - {{ .Values.ingress.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyfin
          # subchart fullname dedupes to "jellyfin" (release name == chart name)
          port: 8096
