---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: preview-smoke
  namespace: {{ .Values.previewSmoke.namespace }}
  labels:
    app: preview-smoke
spec:
  parentRefs:
    - name: preview
      namespace: gateway
  hostnames:
    - {{ .Values.previewSmoke.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: preview-smoke
          port: 80
