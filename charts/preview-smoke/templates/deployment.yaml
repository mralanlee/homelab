---
apiVersion: v1
kind: ConfigMap
metadata:
  name: preview-smoke-html
  namespace: {{ .Values.previewSmoke.namespace }}
  labels:
    app: preview-smoke
data:
  index.html: |
    preview-smoke ok
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-smoke
  namespace: {{ .Values.previewSmoke.namespace }}
  labels:
    app: preview-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-smoke
  template:
    metadata:
      labels:
        app: preview-smoke
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.previewSmoke.image.repository }}:{{ .Values.previewSmoke.image.tag }}"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: preview-smoke-html
