previewTunnel:
  image:
    repository: cloudflare/cloudflared
    tag: "2026.8.1"
  # Two connectors = zero-downtime rollout; a tunnel load-balances over all its
  # connectors natively.
  replicaCount: 2
  # Tunnel "preview" — created with `cloudflared tunnel create preview`.
  # Separate from the lace tunnel on purpose: its remote (dashboard-managed)
  # ingress rules stay untouched. Previews ride their own zone (glyphix.ai,
  # proxied wildcard CNAME `*` -> this tunnel), keeping shimmerlabs.xyz free
  # of apex wildcards (see LEARNINGS.md).
  tunnelId: "ff3551dd-95a0-48ac-a2c1-3ea48a7519de"
  # Ordered ingress rules; a http_status:404 catch-all is always appended.
  ingress:
    - hostname: "*.glyphix.ai"
      service: http://cilium-gateway-preview.gateway.svc.cluster.local:80
  # Secret holding the tunnel credentials file (key: credentials.json).
  credentialsSecretName: preview-tunnel-credentials
  # Sync credentials.json from 1Password via ESO. Until the 1Password item
  # exists, keep disabled and create the Secret by hand:
  #   kubectl -n gateway create secret generic preview-tunnel-credentials \
  #     --from-file=credentials.json=$HOME/.cloudflared/<tunnel-id>.json
  externalSecret:
    enabled: false
    store: onepassword-sdk
    remoteRef: "preview-tunnel-creds/credential"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
