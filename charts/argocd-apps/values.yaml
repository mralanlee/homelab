# GitHub repository URL
repoURL: https://github.com/mralanlee/homelab.git
targetRevision: main

# Sync waves order:
# -10: foundational CRDs (kube-prometheus-stack provides ServiceMonitor)
#   0: default (most apps)
#  10: app-layer that depends on foundational stuff being healthy
apps:
  # Wave -30: Gateway API CRDs (experimental channel for Cilium compatibility)
  - name: gateway-api-crds
    namespace: kube-system
    path: charts/gateway-api-crds
    syncWave: -30
    serverSideApply: true
    replaceLargeCRDs: true

  # Wave -20: prometheus-operator CRDs (must exist before kube-prometheus-stack and any chart using ServiceMonitor)
  - name: prometheus-operator-crds
    namespace: monitoring
    path: charts/prometheus-operator-crds
    syncWave: -20
    serverSideApply: true

  # Wave -10: install first — provides ServiceMonitor CRD that other charts use
  - name: kube-prometheus-stack
    namespace: monitoring
    path: charts/kube-prometheus-stack
    syncWave: -10

  - name: cn-pg
    namespace: cnpg-system
    path: charts/cn-pg
    syncWave: -10
    # clusters/poolers CRDs exceed the client-side last-applied annotation limit
    serverSideApply: true

  # Wave 0: core infrastructure
  - name: cilium
    namespace: kube-system
    path: charts/cilium

  - name: gateway
    namespace: gateway
    path: charts/gateway

  # cloudflared connector for *.glyphix.ai PR previews. Depends on the
  # manually-created preview-tunnel-credentials Secret (see chart values).
  - name: preview-tunnel
    namespace: gateway
    path: charts/preview-tunnel

  - name: bind9
    namespace: bind9
    path: charts/bind9

  - name: external-dns
    namespace: external-dns-internal
    path: charts/external-dns

  - name: cert-manager
    namespace: cert-manager
    path: charts/cert-manager

  - name: external-secrets
    namespace: external-secrets
    path: charts/external-secrets
    # SecretStore/ClusterSecretStore CRDs exceed the client-side last-applied annotation limit
    serverSideApply: true

  - name: democratic-csi
    namespace: democratic-csi
    path: charts/democratic-csi

  - name: metrics-server
    namespace: kube-system
    path: charts/metrics-server

  # Wave 10: ArgoCD self-management. Depends on cert-manager (server cert),
  # external-secrets (dex + repo creds), and gateway (HTTPRoute) — all wave 0.
  # ServerSideApply required: argo-cd CRDs (Application/ApplicationSet/AppProject)
  # exceed the client-side last-applied annotation size limit.
  - name: argocd
    namespace: argocd
    path: charts/argocd
    syncWave: 10
    serverSideApply: true

  # Wave 10: depends on cn-pg + cert-manager + external-secrets
  - name: authentik
    namespace: authentik
    path: charts/authentik
    syncWave: 10
    # cn-pg operator mutates Cluster CR fields. Ignore those to avoid drift.
    ignoreDifferences:
      - group: postgresql.cnpg.io
        kind: Cluster
        jsonPointers:
          - /spec/bootstrap
          - /spec/storage
        managedFieldsManagers:
          - cnpg-controller-manager

  # Wave 10: logs/metrics/traces backend. Depends on democratic-csi (PVC),
  # external-secrets (root creds), gateway (HTTPRoute), and
  # prometheus-operator-crds (ServiceMonitor).
  - name: openobserve
    namespace: openobserve
    path: charts/openobserve
    syncWave: 10
    # The upstream chart generates ZO_REPORT_SERVER_SECRET with `lookup`, which
    # returns nothing under ArgoCD: every render is a new random value, and the
    # pod-template checksum of it restarted OpenObserve on every repo commit.
    respectIgnoreDifferences: true
    ignoreDifferences:
      - kind: Secret
        name: openobserve-report-server
        jsonPointers:
          - /data
          - /stringData
      - group: apps
        kind: StatefulSet
        name: openobserve
        jsonPointers:
          - /spec/template/metadata/annotations/checksum~1report-server-secret

  # Wave 11: pod-log agent (DaemonSet). Depends on openobserve (its sink) and
  # external-secrets (ingest credentials).
  - name: otel-collector
    namespace: otel-collector
    path: charts/otel-collector
    syncWave: 11
